<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Match</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="#" class="logo">
            <img src="./img/logo.png" width="50px" height="50px">
        </a>

        <nav class="navbar">
            <a href="#">Início</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Encontre um jogo <br>
                com base no <span>SEU</span> gosto</h2>

            <p>Responda algumas perguntas e te indicaremos um jogo. </p>

            <button class="start"> Start </button>

        </section>

        <section class="quiz">

            <div class="question">
                <h2>Em que plataforma você joga?</h2>

                <div class="options">
                    <button class="option">Computador</button>
                    <button class="option">PlayStation</button>
                    <button class="option">Xbox</button>
                    <button class="option">Mobile</button>
                </div>

                <div class="question">

                    <h2>Você prefere?</h2>

                    <div class="options">
                        <button class="option">SinglePlayer</button>
                        <button class="option">MultiPlayer</button>
                        <button class="option">Tanto Faz</button>
                    </div>
                </div>
            </div>

        </section>

        <section class="resultado">

        </section>

    </main>

    <footer>

    </footer>


    <script src="scripts.js"></script>
</body>

</html>
